##################################################### Show Init Setup ###########################################################

out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'dept','upload',department)"
roto_out_path: "os.path.join(os.path.dirname(input_path).split('dept')[0],'dept','upload',department)"
sg_plate_name: sg_plate_name #01
roto_main_out: "os.path.join(os.path.dirname(input_path).split('dept')[0],'out',department)"
publish_out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'out')"
color_space_index: 10
sg_status_list: "pentec"
source_path: os.path.basename(source_path)
new_update: yes
##################################################### OOU B_cart creative tool path setup #######################################
paths:
  nuke: /apps/nuke/Nuke14.0v6/Nuke14.0
  silhouette: /usr/local/silhouette/silhouette
  text: xdg-open
  rv: /apps/rv-centos7-2023.0.1/bin/rv
# File extensions configuration
extensions:
  nuke:
    - .nk
  silhouette:
    - .sfx
  text:
    - .txt
    - .json
    - .yml
    - .yaml
    - .log
# Other configuration settings
settings:
  default_cache_dir: ~/nuke_cache
  thumbnail_format: jpeg
###################################################### Tokens ###################################################################
tokens:
  dis_roto:
    nuke_extend_path: []
    silhouette_extend_path: []
    matte_extend_path: []
    nuke_full_shpae_path: /{sg_plate_name}/{out_version}/{shot}_roto{sg_plate_name}_{out_version}/
    out_version: out_version
    resolution: input_path.split("/")[-2]
    frame_range: os.path.basename(input_path).split(".")[1]
    extension: os.path.basename(input_path).split(".")[-1]
    plate_name: source_path.split(".")[0].split("_")[-2].upper()
    exr_file_name: os.path.basename(input_path)
    nuke_file_name: "{shot}_roto{sg_plate_name}_{out_version}.nk"
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_roto{sg_plate_name}_{out_version}/" #02
    mb_nuke_file_template: "{shot}_roto{sg_plate_name}_{out_version}.nk"
    exr_path: /{sg_plate_name}/{out_version}/{shot}_roto{sg_plate_name}{out_version}/exr/{shot}_roto{sg_plate_name}{out_version}.%04d.exr
    mate_snippet:
      {
        "matte_snippet_path": "/tools/bpipe/config/coloroverlay_template/MM_DB & MM_CL _matte_snipet.nk",
      }
    nuke_coloroverlay_template: "/tools/bpipe/config/coloroverlay_template/MM_DB & MM_CL _template.nk"
    mb_nmb: ["MB"]
    input_template_mov: "/tools/oou_comptest_colourloop_1_v001.nk"
    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}{sg_plate_name}_roto{out_version}/scripts/silhouette/{shot}{sg_plate_name}_roto{out_version}.sfx #03
    write_node_path: /{sg_plate_name}/{out_version}/{shot}_roto{sg_plate_name}{out_version}/exr/{shot}_roto{sg_plate_name}{out_version}.%04d.exr #04
    render_list:
      exr_file_path: "{exr_path}"
    render:
      nuke_shape_export:
        "key": ["MB_BKP"]
      sfx_file_copy:
        "key": []
      set_value_nkt:
        "key": []
      export_all_shape_one:
        "key": []
      create_version_data:
        "key": []
    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []
  # ===========================================================================
  # LCDH  –  Rotoscoping delivery (project: car_lcdh)
  #
  #   {sg_plate_name}/{out_version}/{shot}_roto_{out_version}/
  #     ├── Mattes/
  #     │   ├── {shot}_roto_{description}_{out_version}/
  #     │   │   └── {shot}_roto_{description}_{out_version}.%04d.exr
  #     └── Script/
  #         ├── {shot}_roto_{out_version}.nk
  #         └── {shot}_roto_{out_version}.sfx
  # ===========================================================================
  lcdh_roto:
    shot: shot.upper()
    out_version: ("v" + str(out_version).lower().replace("v", "").zfill(3))
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/"
    exr_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/Mattes/"
    matte_extend_path: ["Mattes"]
    nuke_extend_path: ["Script"]
    silhouette_extend_path: ["Script"]
    nuke_full_shpae_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/Script/"
    mb_folder_template: "{shot}_roto_{description}_{out_version}"
    mb_dst_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/Mattes/{shot}_roto_{description}_{out_version}/{shot}_roto_{description}_{out_version}.%04d.exr"
    mb_nuke_file_template: "{shot}_roto_{out_version}.nk"
    nuke_file_name: "{shot}_roto_{out_version}.nk"
    nuke_color_overlay_file: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/Script/{shot}_roto_{out_version}.nk"
    dst_path_sx: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/Script/{shot}_roto_{out_version}.sfx"
    mb_nmb: ["MB"]
    new_update: yes
    matte_path_changes: yes
    render:
      render_list:
        exr_file_path: "{exr_path}"
      run_mb_copy:
        "key": []
      nuke_shape_export:
        "key": ["MB_BKP"]
      export_all_shape_one:
        "key": []
      sfx_file_copy:
        "key": []
      create_version_data:
        "key": []
    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []
################################################### folder Structure ############################################################
project_structure:
  - car:
      - dis:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_roto{sg_plate_name}_{out_version}":
                          - "{shot}_roto{sg_plate_name}_{out_version}.nk"
                          - "{shot}_roto{sg_plate_name}_{out_version}.sfx"
                          - "exr": []
      - lcdh:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_roto_{out_version}":
                          - "Mattes":
                              - "{shot}_roto_{description}_{out_version}": []
                          - "Script":
                              - "{shot}_roto_{out_version}.nk"
                              - "{shot}_roto_{out_version}.sfx"
