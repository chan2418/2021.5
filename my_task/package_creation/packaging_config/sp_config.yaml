out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'dept','upload',department)"
roto_out_path: "os.path.join(os.path.dirname(input_path).split('dept')[0],'dept','upload',department)"
roto_main_out: "os.path.join(os.path.dirname(input_path).split('dept')[0],'out',department)"
publish_out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'out')"
color_space_index: 10
sg_status_list: "pentec"
source_path: os.path.basename(source_path)
sg_plate_name: sg_plate_name #01
new_update: yes
##################################################### OOU B_cart creative tool path setup #######################################

paths:
  nuke: /apps/nuke/Nuke14.0v6/Nuke14.0
  silhouette: /usr/local/silhouette/silhouette
  text: xdg-open
  rv: /apps/rv-centos7-2023.0.1/bin/rv

# File extensions configuration
extensions:
  nuke:
    - .nk
  silhouette:
    - .sfx
  text:
    - .txt
    - .json
    - .yml
    - .yaml
    - .log

# Other configuration settings
settings:
  default_cache_dir: ~/nuke_cache
  thumbnail_format: jpeg

###################################################### Tokens ###################################################################

tokens:
  jlr_roto: #FLX-1003-0285
    user_input_plate: user_input_plate
    shot: shot.upper().replace("-","_")
    plate_version: (os.path.basename(source_path).split(".")[0].split("_")[-1])
    out_version: out_version
    default_out_verison: ("v" + str(int(out_version[1:])).zfill(4))
    resolution: input_path.split("/")[-2]
    frame_range: os.path.basename(input_path).split(".")[1]
    extension: os.path.basename(input_path).split(".")[-1]
    plate_name: source_path.split(".")[0].split("_")[-2].upper()
    # name was bg but the denoised and other thing was came if we not register then the latest version showing wrong
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/" #02
    exr_file_name: os.path.basename(input_path)
    ########################## nuke work file ##########################################

    ######################### MB nuke work file ########################################
    mb_folder_template: "{shot}_roto_{description}_{out_version}"
    mb_nmb: ["MB"] # always be caps

    # input_template_mov: "/tools/oou_comptest_colourloop_1_v001.nk"

    ################################# work file path copy path ############################
    nuke_file_path: /{sg_plate_name}/{out_version}/{shot}_{user_input_plate}/nuke/scripts/{shot}_{sg_plate_name}_{plate_version}_roto_{default_out_verison}.nk # nuke work file copy path
    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}_{user_input_plate}/silhouette/scripts/{shot}_{sg_plate_name}_{plate_version}_roto_{default_out_verison}.sfx # silhouette work file copy path

    ################################ coloroverlay renders #############################
    write_node_path: /{sg_plate_name}/{out_version}/{shot}_{user_input_plate}/{shot}_basilicflyroto_{plate_name}_differenceoverlay_{default_out_verison}/{shot}_basilicflyroto_{plate_name}_differenceoverlay_{default_out_verison}.%04d.exr #04
    exr_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/" #02 # upload in the sg
    nuke_coloroverlay_template: "/tools/bpipe/config/coloroverlay_template/nuke_color_overlay.nk" # nuke template
    nuke_color_overlay_file: /{sg_plate_name}/{out_version}/{shot}_{user_input_plate}/nuke/scripts/{shot}_{sg_plate_name}_{plate_version}_roto_{default_out_verison}.nk
    render_list:
      exr_file_path: "{exr_path}"

    render:
      mate_copy:
        "key": []
      create_version_data:
        "key": []
    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

project_structure:
  - sp:
      - jlr:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}": #04
                      - "{shot}_roto_{out_version}":
                          - "{shot}_roto_{description}_{out_version}": []
