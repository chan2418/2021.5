#################################################### Show Init Setup ###########################################################
out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'dept','upload',department)"
roto_out_path: "os.path.join(os.path.dirname(input_path).split('dept')[0],'dept','upload',department)"
roto_main_out: "os.path.join(os.path.dirname(input_path).split('dept')[0],'out',department)"
publish_out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'out')"
color_space_index: 10
sg_status_list: "pentec"
source_path: source_path
plate_name: ""
new_update: yes
matte_path_changes: yes

# ====================== NEW KEYS ======================
enable_csmt_shape_checkbox: true # Show Global / Shape checkboxes in UI
# ======================================================

paths:
  nuke: /apps/nuke/Nuke14.0v6/Nuke14.0
  silhouette: /usr/local/silhouette/silhouette
  text: xdg-open
  rv: /apps/rv-centos7-2023.0.1/bin/rv

extensions:
  nuke:
    - .nk
  silhouette:
    - .sfx
  text:
    - .txt
    - .json
    - .yml
    - .yaml
    - .log

settings:
  default_cache_dir: ~/nuke_cache
  thumbnail_format: jpeg

tokens:
  tlo4_roto:
    chunk: 500
    matte_extend_path: ["matte_renders_exr"]
    shot: shot.lower()
    out_version: ("v" + out_version.replace("v", ""))
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    plate_name: next((s[i:i+4] for s in reversed(source_path.split('_')) for i in reversed(range(len(s)-3)) if s[i:i+2].isalpha() and s[i+2:i+4].isdigit()), None)
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_os_{out_version}/"
    exr_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_os_{out_version}/"
    mb_folder_template: "" # ← empty: description folder IS the destination
    matte_naming_convention: "{shot}_roto_{sg_plate_name}_os_{description}_{out_version}" # ← controls filename only
    matte_extra_folder: no # ← no extra named subfolder inside matte01/matte02

    nmb_extend_path: ["matte_renders_nmb", "{description}"]
    # /projects/bsm_tlo4/tlo4_402_016_0510/dept
    nmb_project_base_path: "/projects/{client}_{show}/{shot}/dept/roto/{user_name}/.nmb/"
    nmb_folder_template: ""

    mb_nmb: ["MB", "NMB"]
    matte_path_changes: yes
    nuke_coloroverlay_template: "/tools/bpipe/config/coloroverlay_template/nuke_coloroverlay_bsm.nk"
    dst_path_sx: "/{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_os_{out_version}/workfile_sfx/{shot}_roto_{sg_plate_name}_os_{out_version}.sfx"
    nuke_color_overlay_file: "/{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_os_{out_version}/workfile_nuke/{shot}_roto_{sg_plate_name}_os_{out_version}.nk"
    write_node_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_os_{out_version}/matte_renders_exr/matte-01/{shot}_roto_{sg_plate_name}_os_{out_version}.%04d.exr"
    write_node_path_nmb: /{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_os_{out_version}/preview_mov/{shot}_roto_{sg_plate_name}_os_{out_version}.mov
    additional_write_path: ["write_node_path_nmb"]
    render_list:
      exr_file_path: "{exr_path}"
    render:
      render_nmb_token_driven:
        "key": ["NMB"]
      sfx_file_copy:
        key: []
      nuke_multiple_shape_export:
        "key": []
      nuke_shape_export:
        "key": ["MB_BKP"]
      export_all_shape_one:
        key: []
      set_value_nkt:
        key: []
      create_version_data:
        key: []
    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

project_structure:
  - bsm:
      - tlo4:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_roto_{sg_plate_name}_os_{out_version}":
                          - matte_renders_exr:
                              - "matte-01": []
                              - "matte-02": []
                              - "matte-03": []
                              - "matte-04": []
                              - "matte-05": []

                          - preview_mov:
                              - "{shot}_roto_{sg_plate_name}_os_{out_version}.mov"
                          - workfile_nuke:
                              - "{shot}_roto_{sg_plate_name}_os_{out_version}.nk"
                          - workfile_sfx:
                              - "{shot}_roto_{sg_plate_name}_os_{out_version}.sfx"
