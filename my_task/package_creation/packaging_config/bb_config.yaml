#################################################### Show Init Setup ###########################################################

out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'dept','upload',department)"
roto_out_path: "os.path.join(os.path.dirname(input_path).split('dept')[0],'dept','upload',department)"
roto_main_out: "os.path.join(os.path.dirname(input_path).split('dept')[0],'out',department)"
publish_out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'out')"
color_space_index: 10
sg_status_list: "pentec"
source_path: source_path
sg_plate_name: sg_plate_name #01
plate_name: ""

##################################################### DST B_cart creative tool path setup #######################################

paths:
  nuke: /apps/nuke/Nuke14.0v6/Nuke14.0
  silhouette: /usr/local/silhouette/silhouette
  text: xdg-open
  rv: /apps/rv-centos7-2023.0.1/bin/rv

# File extensions configuration
extensions:
  nuke:
    - .nk
  silhouette:
    - .sfx
  text:
    - .txt
    - .json
    - .yml
    - .yaml
    - .log

# Other configuration settings
settings:
  default_cache_dir: ~/nuke_cache
  thumbnail_format: jpeg

###################################################### Tokens ###################################################################

tokens:
  teds2_roto:
    # ui : True
    shot: shot.upper()
    out_version: ("v" + out_version.replace("v", ""))
    # plate_version: ("v" + os.path.basename(source_path).split(".")[2].replace("v", "").zfill(3))
    plate_version: ("v" + os.path.basename(source_path).split(".")[-3].replace("v", "").zfill(3))
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    plate_name: next((s[i:i+4] for s in reversed(source_path.split('_')) for i in reversed(range(len(s)-3)) if s[i:i+2].isalpha() and s[i+2:i+4].isdigit()), None)
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_taskA.{out_version}/" #02
    # exr_path : "os.path.join(out_path,sg_plate_name,out_version,shot+'_plate_'+plate_name+'_'+out_version,shot+'_plate_'+plate_name+'_roto_rotomain01_'+out_version,shot+'_plate_'+plate_name+'_roto_rotomain01_'+out_version+'.%04d.exr')"
    exr_path: /{sg_plate_name}/{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_taskA.{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_overlay_taskA.{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_overlay_taskA.{out_version}.%04d.exr
    # mate_snippet : {"matte_snippet_path":"/tools/bpipe/config/coloroverlay_template/nuke_mate_snippet_mxp.nk"}

    nuke_coloroverlay_template: "/tools/bpipe/config/coloroverlay_template/nuke_color_overlay_bb.nk"
    nmb_project_base_path: "/projects/{client}_{show}/{shot}/dept/roto/{user_name}/.nmb/"
    nmb_extend_path: ["{out_version}", "matte_renders_nmb", "{description}"]
    nmb_folder_template: ""
    mb_nmb: ["MB", "NMB"]
    # nuke_color_overlay_file : "os.path.join(out_path,sg_plate_name+out_version,shot+'_plate_'+plate_name+'_'+out_version,'nuke',shot+'_roto_main_'+out_version+'.nk')" #06
    nuke_color_overlay_file: /{sg_plate_name}/{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_taskA.{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_taskA.{out_version}.nk #04
    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_taskA.{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_taskA.{out_version}.sfx #03
    write_node_path: /{sg_plate_name}/{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_taskA.{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_overlay_taskA.{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_overlay_taskA.{out_version}.%04d.exr #04
    write_node_path_matte: /{sg_plate_name}/{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_taskA.{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_mattes_taskA.{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_mattes_taskA.{out_version}.%04d.exr
    write_node_path_nmb: /{sg_plate_name}/{out_version}/{shot}.{sg_plate_name}.{plate_version}.roto_taskA.{out_version}/mov/{shot}.{sg_plate_name}.{plate_version}.roto_taskA.{out_version}.mov
    additional_write_path: ["write_node_path_matte", "write_node_path_nmb"]
    nuke_client_file: /tools/bpipe/config/coloroverlay_template/nuke_color_overlay_shape_dst.nk
    # write_node_path : "os.path.join(out_path,sg_plate_name+out_version,shot+'_plate_'+plate_name+'_'+out_version,shot+'_plate_'+plate_name+'_roto_rotomain01_'+out_version,shot+'_plate_'+plate_name+'_roto_rotomain01_'+out_version+'.%04d.exr')"
    render_list:
      exr_file_path: "{exr_path}"
    render:
      render_nmb_token_driven:
        "key": ["NMB"]
      sfx_file_copy:
        "key": [] #05
        # "dst_sfx_path": "/{sg_plate_name}{out_version}/{shot}_plate_{plate_name}_{out_version}/silhouette/{shot}_roto_main_{out_version}.sfx"
      # nuke_shape_export:
      #   "key": ["MB_BKP"]
      nuke_multiple_shape_export:
        "key": []
      set_value_nkt:
        "key": []
      save_tmp_coloroverlay:
        "key": []
      change_nuke_file:
        "key": []
      create_version_data:
        "key": []

    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

  test_roto:
    # ui : True
    shot: shot.upper()
    out_version: ("v" + out_version.replace("v", ""))
    # plate_version: ("v" + os.path.basename(source_path).split(".")[2].replace("v", "").zfill(3))
    plate_version: ("v" + os.path.basename(source_path).split(".")[2].replace("v", "").zfill(3))
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    plate_name: next((s[i:i+4] for s in reversed(source_path.split('_')) for i in reversed(range(len(s)-3)) if s[i:i+2].isalpha() and s[i+2:i+4].isdigit()), None)
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/" #02
    # exr_path : "os.path.join(out_path,sg_plate_name,out_version,shot+'_plate_'+plate_name+'_'+out_version,shot+'_plate_'+plate_name+'_roto_rotomain01_'+out_version,shot+'_plate_'+plate_name+'_roto_rotomain01_'+out_version+'.%04d.exr')"
    exr_path: /{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/exr/{shot}_roto_{sg_plate_name}_{out_version}.%04d.exr
    # mate_snippet : {"matte_snippet_path":"/tools/bpipe/config/coloroverlay_template/nuke_mate_snippet_mxp.nk"}
    nuke_coloroverlay_template: "/tools/bpipe/config/coloroverlay_template/nuke_color_overlay_dst.nk"
    mb_nmb: []
    # nuke_color_overlay_file : "os.path.join(out_path,sg_plate_name+out_version,shot+'_plate_'+plate_name+'_'+out_version,'nuke',shot+'_roto_main_'+out_version+'.nk')" #06
    nuke_color_overlay_file: /{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/workfiles/{shot}_roto_{sg_plate_name}_{out_version}.nk #04
    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/workfiles/{shot}_roto_{sg_plate_name}_{out_version}.sfx #03
    write_node_path: /{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/exr/{shot}_roto_{sg_plate_name}_{out_version}.%04d.exr #04
    write_node_path_matte: /{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/exr/{shot}_roto_{sg_plate_name}_{out_version}.%04d.exr
    additional_write_path: ["write_node_path_matte"]
    nuke_client_file: /tools/bpipe/config/coloroverlay_template/nuke_color_overlay_shape_dst.nk
    # write_node_path : "os.path.join(out_path,sg_plate_name+out_version,shot+'_plate_'+plate_name+'_'+out_version,shot+'_plate_'+plate_name+'_roto_rotomain01_'+out_version,shot+'_plate_'+plate_name+'_roto_rotomain01_'+out_version+'.%04d.exr')"
    render_list:
      exr_file_path: "{exr_path}"
    render:
      sfx_file_copy:
        "key": [] #05
        # "dst_sfx_path": "/{sg_plate_name}{out_version}/{shot}_plate_{plate_name}_{out_version}/silhouette/{shot}_roto_main_{out_version}.sfx"
      # nuke_shape_export:
      #   "key": ["MB_BKP"]
      nuke_multiple_shape_export:
        "key": []
      set_value_nkt:
        "key": []
      save_tmp_coloroverlay:
        "key": []
      change_nuke_file:
        "key": []
      create_version_data:
        "key": []

    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

  nciss4_roto:
    chunk: 500
    shot: shot.lower()
    out_version: ("v" + out_version.replace("v", ""))
    plate_version: ("v" + os.path.basename(source_path).split(".")[-3].replace("v", "").zfill(3))
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    plate_name: next((s[i:i+4] for s in reversed(source_path.split('_')) for i in reversed(range(len(s)-3)) if s[i:i+2].isalpha() and s[i+2:i+4].isdigit()), None)

    # Deliverable root folder: eg. 105_021_0110_roto_A01_a_v001
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/"

    # EXR sequence deliverable
    exr_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/exr/{shot}_roto_{sg_plate_name}_{out_version}.%04d.exr"
    write_node_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/exr/{shot}_roto_{sg_plate_name}_{out_version}.%04d.exr"
    write_node_path_matte: "/{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/exr/{shot}_roto_{sg_plate_name}_{out_version}.%04d.exr"

    # Review MOV deliverable (1920x1080 fit, Rec.709, red overlay)
    mov_write_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/mov/{shot}_roto_{sg_plate_name}_{out_version}.mov"

    # Workfiles deliverables
    nuke_color_overlay_file: "/{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/workfiles/{shot}_roto_{sg_plate_name}_{out_version}.nk"
    dst_path_sx: "/{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/workfiles/{shot}_roto_{sg_plate_name}_{out_version}.sfx"

    nuke_coloroverlay_template: "/tools/bpipe/config/coloroverlay_template/nuke_color_overlay_bb.nk"
    nuke_client_file: "/tools/bpipe/config/coloroverlay_template/nuke_color_overlay_bb_shape.nk"

    nmb_project_base_path: "/projects/{client}_{show}/{shot}/dept/roto/{user_name}/.nmb/"
    nmb_extend_path: ["{out_version}", "matte_renders_nmb", "{description}"]
    nmb_folder_template: ""
    mb_nmb: ["MB", "NMB"]
    additional_write_path: ["write_node_path_matte", "mov_write_path"]

    render_list:
      exr_file_path: "{exr_path}"
    render:
      render_nmb_token_driven:
        "key": ["NMB"]
      sfx_file_copy:
        "key": []
      nuke_multiple_shape_export:
        "key": []
        export_mode: "node"
      set_value_nkt:
        "key": []
      save_tmp_coloroverlay:
        "key": []
      create_version_data:
        "key": []

    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

################################################### folder Structure ############################################################

project_structure:
  - bb:
      - teds2:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}": #04
                      - "{shot}_roto_{sg_plate_name}_b_{out_version}":
                          - exr
                          - mov
                          - workfiles

                          - "{shot}.{sg_plate_name}.{plate_version}.roto_mattes_taskA.{out_version}":
                              []
                          - "{shot}.{sg_plate_name}.{plate_version}.roto_overlay_taskA.{out_version}":
                              []
                          - "{shot}.{sg_plate_name}.{plate_version}.roto_taskA.{out_version}.nk"
                          - "{shot}.{sg_plate_name}.{plate_version}.roto_taskA.{out_version}.sfx"

      - nciss4:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_roto_{sg_plate_name}_{out_version}":
                          - exr: []
                          - mov: []
                          - workfiles: []
