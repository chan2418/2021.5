################################################### folder Structure ############################################################

project_structure:

  - bfu:
    - wam:
      - roto:                                          
        - "{sg_plate_name}":
          - "{out_version}": #04
            - "{shot}_plate_{plate_name}_{out_version}":
              - "{shot}_plate_{plate_name}_roto_rotomain01_{out_version}": []
              - nuke:
                - "{shot}_roto_main_{out_version}.nk"
              - silhouette:
                - "{shot}_roto_main_{out_version}.sfx"
   
    - sos:
      - roto:                                          
        - "{sg_plate_name}":
          - "{out_version}": #04
            - "{shot}_{plate_name}_{plate_version}":
              - "{shot}_{plate_name}_roto_rotomain01_{out_version}": []
              - nuke:
                - "{shot}_roto_main_{plate_version}.nk"
              - silhouette:
                - "{shot}_roto_main_{plate_version}.sfx"

    - mro:
      - roto:                                          
        - "{sg_plate_name}":
          - "{out_version}": #04
            - "{shot}_roto_{plate_name}-outsource_{plate_version}":
              - "{shot}_roto_{plate_name}-outsource_{plate_version}": []
              - nuke:
                - "{shot}_roto_{plate_name}-outsource_{plate_version}.nk"
              - silhouette:
                - "{shot}_roto_{plate_name}-outsource_{plate_version}.sfx"
