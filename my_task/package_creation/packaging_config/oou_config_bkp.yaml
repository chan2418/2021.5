##################################################### Show Init Setup ###########################################################

out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'dept','upload',department)"
roto_out_path: "os.path.join(os.path.dirname(input_path).split('dept')[0],'dept','upload',department)"
roto_main_out: "os.path.join(os.path.dirname(input_path).split('dept')[0],'out',department)"
publish_out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'out')"
color_space_index: 10
sg_status_list: "pentec"
source_path: os.path.basename(source_path)
sg_plate_name: sg_plate_name #01

##################################################### OOU B_cart creative tool path setup #######################################

paths:
  nuke: /apps/nuke/Nuke14.0v6/Nuke14.0
  silhouette: /usr/local/silhouette/silhouette
  text: xdg-open
  rv: /apps/rv-centos7-2023.0.1/bin/rv

# File extensions configuration
extensions:
  nuke:
    - .nk
  silhouette:
    - .sfx
  text:
    - .txt
    - .json
    - .yml
    - .yaml
    - .log

# Other configuration settings
settings:
  default_cache_dir: ~/nuke_cache
  thumbnail_format: jpeg

###################################################### Tokens ###################################################################

tokens:
  tb_roto:
    out_version: out_version
    resolution: input_path.split("/")[-2]
    frame_range: os.path.basename(input_path).split(".")[1]
    extension: os.path.basename(input_path).split(".")[-1]
    # plate_name : next((s[i:i+4] for s in reversed(source_path.split('_')) for i in reversed(range(len(s)-3)) if s[i:i+2].isalpha() and s[i+2:i+4].isdigit()), None)
    plate_name: source_path.split(".")[0].split("_")[-2].upper()
    exr_file_name: os.path.basename(input_path)
    nuke_file_name: "{shot}_basilicflyroto_{description}_MB_{out_version}.nk"
    mb_folder_template: "{shot}_silhouette_basilicflyroto_{plate_name}_{description}_MB_{out_version}"
    nmb_folder_template: "{shot}_silhouette_basilicflyroto_{plate_name}_{description}_NMB_{out_version}"
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}/" #02
    # nuke_file_path : "os.path.join(out_path, 'roto', out_version, shot, shot+'_basilicflyroto_'+description+'_MB_'+out_version+'.nk')"
    # nuke_file_template: "{shot}_basilicflyroto_{description}_MB_{out_version}.nk"
    mb_nuke_file_template: "{shot}_basilicflyroto_{plate_name}_{description}_MB_{out_version}.nk"
    nmb_nuke_file_template: "{shot}_basilicflyroto_{plate_name}_{description}_NMB_{out_version}.nk"
    nuke_file_path: os.path.join(out_path, 'roto', out_version, shot, shot+"_basilicflyroto_"+description+"_MB_"+out_version+".nk")
    # exr_path : os.path.join(out_path,sg_plate_name,out_version,shot,shot+"_basilicflyroto_differenceoverlay_"+out_version+"."+frame_range+"."+extension)
    exr_path: "/{sg_plate_name}/{out_version}/{shot}/{shot}_basilicflyroto_differenceoverlay_{out_version}/{shot}_basilicflyroto_differenceoverlay_{out_version}.%04d.exr" #02
    nuke_coloroverlay_template: "/tools/bpipe/config/coloroverlay_template/nuke_color_overlay.nk"
    mb_nmb: ["MB", "NMB"]

    input_template_mov: "/tools/oou_comptest_colourloop_1_v001.nk"
    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}/{shot}_basilicflyroto_{plate_name}_{out_version}.sfx #03

    # write_node_path : "os.path.join(out_path,sg_plate_name+out_version,shot,shot+'_basilicflyroto_differenceoverlay_'+out_version,shot+'_basilicflyroto_differenceoverlay_'+out_version+'.%04d.exr')"

    write_node_path: /{sg_plate_name}/{out_version}/{shot}/{shot}_basilicflyroto_{plate_name}_differenceoverlay_{out_version}/{shot}_basilicflyroto_{plate_name}_differenceoverlay_{out_version}.%04d.exr #04

    matte_path_split:
      file_name: "file_name.split('_')[-2]"
    render_list:
      exr_file_path: "{exr_path}"
    render:
      # rendering_proxy_mov:
      #   dest_path : "{write_node_path}"
      mate_copy:
        "key": []
      nuke_shape_export:
        "key": ["MB", "NMB"]
      sfx_file_copy:
        "key": []
        # "dst_sfx_path": "/{out_version}/{shot}/{shot}_basilicflyroto_{out_version}.sfx"
      # render_nmb:
      #   "nmb_path" : "/{out_version}/{shot}/{shot}_silhouette_basilicflyroto_PL01V001_{description}_NMB_{out_version}"
      render_nmb:
        "key": ["NMB"] # want nmb render send the nmb key
      create_version_data:
        "key": []
    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

