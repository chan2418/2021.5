##########################################################################

#       SHOW : HAR (har_bbf)

###########################################################################

out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'dept','upload',department)"
roto_out_path: "os.path.join(os.path.dirname(input_path).split('dept')[0],'dept','upload',department)"
roto_main_out: "os.path.join(os.path.dirname(input_path).split('dept')[0],'out',department)"
publish_out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'out')"
color_space_index: 10
sg_status_list: "pentec"
source_path: source_path
sg_plate_name: sg_plate_name
plate_name: ""
new_update: yes
matte_path_changes: yes

##################################################### HAR B_cart creative tool path setup #######################################

paths:
  nuke: /apps/nuke/Nuke14.0v6/Nuke14.0
  silhouette: /usr/local/silhouette/silhouette
  text: xdg-open
  rv: /apps/rv-centos7-2023.0.1/bin/rv

extensions:
  nuke: [.nk]
  silhouette: [.sfx]
  text: [.txt, .json, .yml, .yaml, .log]

settings:
  default_cache_dir: ~/nuke_cache
  thumbnail_format: jpeg

###################################################### Tokens ###################################################################

tokens:
  bbf_roto:
    shot: shot.upper()
    out_version: ("v" + out_version.replace("v", ""))
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    plate_name: next((s[i:i+4] for s in reversed(source_path.split('_')) for i in reversed(range(len(s)-3)) if s[i:i+2].isalpha() and s[i+2:i+4].isdigit()), None)

    # Only MB is used (run_mb_copy copies artist-selected matte renders)
    mb_nmb: ["MB"]

    # Root deliverable folder: {sg_plate_name}/{out_version}/blb_shots_{shot}/
    project_base_path: "/{sg_plate_name}/{out_version}/blb_shots_{shot}/"

    # Matte destination for run_mb_copy
    # Result: {sg_plate_name}/v001/blb_shots_ALT_3030/mattes/blb_shots_ALT_3030_roto_glass_render_main_v001/...
    mb_dst_path: "/{sg_plate_name}/{out_version}/blb_shots_{shot}/mattes/blb_shots_{shot}_roto_{description}_render_main_{out_version}/blb_shots_{shot}_roto_{description}_render_main_{out_version}.%04d.exr"

    # exr_path points to the mattes folder (used internally for structure)
    exr_path: "/{sg_plate_name}/{out_version}/blb_shots_{shot}/mattes/"

    # Nuke script: {sg_plate_name}/v001/blb_shots_ALT_3030/scripts/blb_shots_ALT_3030_roto_v001.nk
    nuke_color_overlay_file: "/{sg_plate_name}/{out_version}/blb_shots_{shot}/scripts/blb_shots_{shot}_roto_{out_version}.nk"

    # SFX script: {sg_plate_name}/v001/blb_shots_ALT_3030/scripts/blb_shots_ALT_3030_roto_v001.sfx
    dst_path_sx: "/{sg_plate_name}/{out_version}/blb_shots_{shot}/scripts/blb_shots_{shot}_roto_{out_version}.sfx"

    new_update: yes
    matte_path_changes: yes

    render:
      # Copy artist-selected MB matte renders to mattes folder
      run_mb_copy:
        "key": []

      # Export individual shape per layer as backup
      nuke_shape_export:
        "key": ["MB_BKP"]

      # Export all roto shapes into one combined .nk file
      export_all_shape_one:
        "key": []

      # Copy the Silhouette .sfx project file
      sfx_file_copy:
        "key": []

      create_version_data:
        "key": []

    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

################################################### Folder Structure ############################################################

project_structure:
  - har:
      - bbf:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "blb_shots_{shot}":
                          - mattes:
                              - "blb_shots_{shot}_roto_{description}_render_main_{out_version}":
                                  []
                          - scripts:
                              - "blb_shots_{shot}_roto_{out_version}.nk"
                              - "blb_shots_{shot}_roto_{out_version}.sfx"
