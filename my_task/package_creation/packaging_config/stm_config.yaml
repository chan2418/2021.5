    exr_path: /{sg_plate_name}/{out_version}/{shot}_roto_BFS_{out_version}/
    # mate_snippet : {"matte_snippet_path":"/tools/bpipe/config/coloroverlay_template/nuke_mate_snippet_mxp.nk"}
    mb_folder_template: "{description}"
    matte_folder: True
