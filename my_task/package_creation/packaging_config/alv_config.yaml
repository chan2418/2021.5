#################################################### Show Init Setup ###########################################################

out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'dept','upload',department)"
roto_out_path: "os.path.join(os.path.dirname(input_path).split('dept')[0],'dept','upload',department)"
roto_main_out: "os.path.join(os.path.dirname(input_path).split('dept')[0],'out',department)"
publish_out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'out')"
color_space_index: 10
sg_status_list: "pentec"
source_path: source_path
plate_name: ""
new_update: yes
matte_path_changes: yes

##################################################### smt B_cart creative tool path setup #######################################

paths:
  nuke: /apps/nuke/Nuke14.0v6/Nuke14.0
  silhouette: /usr/local/silhouette/silhouette
  text: xdg-open
  rv: /apps/rv-centos7-2023.0.1/bin/rv

# File extensions configuration
extensions:
  nuke:
    - .nk
  silhouette:
    - .sfx
  text:
    - .txt
    - .json
    - .yml
    - .yaml
    - .log

# Other configuration settings
settings:
  default_cache_dir: ~/nuke_cache
  thumbnail_format: jpeg
tokens:
  tms_roto:
    matte_extend_path: ["mattes"]
    shot: shot.upper()
    out_version: ("v" + out_version.replace("v", ""))
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    plate_name: next((s[i:i+4] for s in reversed(source_path.split('_')) for i in reversed(range(len(s)-3)) if s[i:i+2].isalpha() and s[i+2:i+4].isdigit()), None)
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_roto_{out_version}/" #02
    exr_path: /{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_roto_{out_version}/
    mb_folder_template: "{shot}_{sg_plate_name}_{description}_{out_version}"
    # matte_folder: True
    mb_nmb: ["MB"]

    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_roto_{out_version}/scripts/{shot}_{sg_plate_name}_roto_{out_version}.sfx #03
    nuke_color_overlay_file: /{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_roto_{out_version}/scripts/{shot}_{sg_plate_name}_roto_{out_version}.nk #03
    fusion_shape: /{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_roto_{out_version}/scripts/{shot}_{sg_plate_name}_roto_{out_version}.setting #03

    render_list:
      exr_file_path: "{exr_path}"

    render:
      mate_copy:
        "key": []
      sfx_file_copy:
        "key": []
      nuke_shape_export:
        "key": ["MB_BKP"]
      export_all_shape_one:
        "key": []
      export_fusion_shape:
        "key": []
      create_version_data:
        "key": []

    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

  obx_roto:
    matte_extend_path: ["mattes"]
    shot: shot.upper()
    out_version: ("v" + out_version.replace("v", ""))
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    plate_name: next((s[i:i+4] for s in reversed(source_path.split('_')) for i in reversed(range(len(s)-3)) if s[i:i+2].isalpha() and s[i+2:i+4].isdigit()), None)
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/" #02
    exr_path: /{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/
    mb_folder_template: "{shot}_{description}_{out_version}"
    # matte_folder: True
    mb_nmb: ["MB"]

    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/scripts/{shot}_roto_{out_version}.sfx #03
    nuke_color_overlay_file: /{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/scripts/{shot}_roto_{out_version}.nk #03
    fusion_shape: /{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/scripts/{shot}_roto_{out_version}.setting #03

    # matte_path_split:
    #   file_name: "file_name.split('_')[-2]"

    render_list:
      exr_file_path: "{exr_path}"

    render:
      mate_copy:
        "key": []
      sfx_file_copy:
        "key": []
      nuke_shape_export:
        "key": ["MB_BKP"]
      export_all_shape_one:
        "key": []
      export_fusion_shape:
        "key": []
      create_version_data:
        "key": []

    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

project_structure:
  - alv:
      - obx:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_roto_{out_version}":
                          - mattes: []
                          - scripts:
                              - "{shot}_roto_{out_version}.nk"
                              - "{shot}_roto_{out_version}.setting"
                              - "{shot}_roto_{out_version}.sfx"
      - tms:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_{sg_plate_name}_roto_{out_version}":
                          - mattes: []
                          - scripts:
                              - "{shot}_{sg_plate_name}_roto_{out_version}.nk"
                              - "{shot}_{sg_plate_name}_roto_{out_version}.setting"
                              - "{shot}_{sg_plate_name}_roto_{out_version}.sfx"
