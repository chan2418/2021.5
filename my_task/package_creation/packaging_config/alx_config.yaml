      mate_nuke_set:
        "key": ["/tools/bpipe/config/matte_template/alx_aln_template.nk"]
      nuke_shape_export:
        "key": ["MB_BKP"]
      sfx_file_copy:
        "key": []
      export_all_shape_one:
        "key": []
      create_version_data:
        "key": []
    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

