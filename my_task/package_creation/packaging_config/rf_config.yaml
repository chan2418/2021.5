    render:
      mate_copy:
        "key": []
      nuke_shape_export:
        "key": ["MB_BKP"]
      export_all_shape_one:
        "key": []
      create_version_data:
        "key": []
      set_value_nkt:
        "key": []
    nuke_template_context_data:
      MB_matte_path:
