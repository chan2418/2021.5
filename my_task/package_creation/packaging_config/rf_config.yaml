#################################################### Show Init Setup ###########################################################

out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'dept','upload',department)"
roto_out_path: "os.path.join(os.path.dirname(input_path).split('dept')[0],'dept','upload',department)"
roto_main_out: "os.path.join(os.path.dirname(input_path).split('dept')[0],'out',department)"
publish_out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'out')"
color_space_index: 10
sg_status_list: "pentec"
source_path: source_path
sg_plate_name: sg_plate_name #01
plate_name: ""
new_update: yes
matte_path_changes: yes

##################################################### smt B_cart creative tool path setup #######################################

paths:
  nuke: /apps/nuke/Nuke14.0v6/Nuke14.0
  silhouette: /usr/local/silhouette/silhouette
  text: xdg-open
  rv: /apps/rv-centos7-2023.0.1/bin/rv

# File extensions configuration
extensions:
  nuke:
    - .nk
  silhouette:
    - .sfx
  text:
    - .txt
    - .json
    - .yml
    - .yaml
    - .log

# Other configuration settings
settings:
  default_cache_dir: ~/nuke_cache
  thumbnail_format: jpeg

###################################################### Tokens ###################################################################

tokens:
  glf_roto:
    shot: shot.upper()
    out_version: ("v" + out_version.replace("v", ""))
    show_maintain_version: out_version.replace("v","")
    plate_version: ("v" + os.path.basename(source_path).split(".")[2].replace("v", "").zfill(3))
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    plate_name: next((s[i:i+4] for s in reversed(source_path.split('_')) for i in reversed(range(len(s)-3)) if s[i:i+2].isalpha() and s[i+2:i+4].isdigit()), None)
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_ROTO_BAC_{show_maintain_version}/" #02
    exr_path: /{sg_plate_name}/{out_version}/{shot}_ROTO_BAC_{show_maintain_version}/
    mb_folder_template: "{shot}_{sg_plate_name}_roto_{description}_{out_version}"
    mb_nmb: ["MB"]
    nuke_color_overlay_file: /{sg_plate_name}/{out_version}/{shot}_ROTO_BAC_{show_maintain_version}/script/{shot}_roto_{out_version}.nk #04
    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}_ROTO_BAC_{show_maintain_version}/script/{shot}_roto_{out_version}.sfx #03
    matte_path_split:
      file_name: "file_name.split('_')[-2]"
    render_list:
      exr_file_path: "{exr_path}"
    render:
      mate_copy:
        "key": []
      sfx_file_copy:
        "key": []
      nuke_shape_export:
        "key": ["MB_BKP"]
      export_all_shape_one:
        "key": []
      create_version_data:
        "key": []

    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

  lat_roto:
    shot: shot.upper()
    out_version: ("v" + out_version.replace("v", ""))
    show_maintain_version: out_version.replace("v","")
    plate_version: ("v" + os.path.basename(source_path).split(".")[2].replace("v", "").zfill(3))
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    plate_name: next((s[i:i+4] for s in reversed(source_path.split('_')) for i in reversed(range(len(s)-3)) if s[i:i+2].isalpha() and s[i+2:i+4].isdigit()), None)
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_ROTO_BAC_{show_maintain_version}/" #02
    exr_path: /{sg_plate_name}/{out_version}/{shot}_ROTO_BAC_{show_maintain_version}/
    mb_folder_template: "{shot}_{sg_plate_name}_roto_{description}_{out_version}"
    mate_snippet:
      {
        "matte_snippet_path": "/tools/bpipe/config/coloroverlay_template/nuke_mov_template.nk",
      }
    nuke_coloroverlay_template: "/tools/bpipe/config/coloroverlay_template/nuke_mov_template.nk"
    mb_nmb: ["MB"]
    nuke_color_overlay_file: /{sg_plate_name}/{out_version}/{shot}_ROTO_BAC_{show_maintain_version}/script/{shot}_roto_{out_version}.nk #04
    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}_ROTO_BAC_{show_maintain_version}/script/{shot}_roto_{out_version}.sfx #03
    write_node_path: /{sg_plate_name}/{out_version}/{shot}_ROTO_BAC_{show_maintain_version}/{shot}_ROTO_BAC_{show_maintain_version}.mov #04
    matte_path_split:
      file_name: "file_name.split('_')[-2]"
    render_list:
      exr_file_path: "{exr_path}"
    render:
      mate_copy:
        "key": []
      sfx_file_copy:
        "key": []
      nuke_shape_export:
        "key": ["MB_BKP"]
      export_all_shape_one:
        "key": []
      set_value_nkt:
        "key": []
      create_version_data:
        "key": []

    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

  tnt_roto:
    shot: shot.upper()
    out_version: ("v" + out_version.replace("v", ""))
    show_maintain_version: out_version.replace("v","")
    plate_version: ("v" + os.path.basename(source_path).split(".")[2].replace("v", "").zfill(3))
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    plate_name: next((s[i:i+4] for s in reversed(source_path.split('_')) for i in reversed(range(len(s)-3)) if s[i:i+2].isalpha() and s[i+2:i+4].isdigit()), None)
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_ROTO_BAC_{show_maintain_version}/" #02
    exr_path: /{sg_plate_name}/{out_version}/{shot}_ROTO_BAC_{show_maintain_version}/
    mb_folder_template: "{shot}_{sg_plate_name}_roto_{description}_{out_version}"
    mb_nmb: ["MB"]
    nuke_coloroverlay_template: "/tools/bpipe/config/coloroverlay_template/nuke_mov_input_template.nk"
    nuke_color_overlay_file: /{sg_plate_name}/{out_version}/{shot}_ROTO_BAC_{show_maintain_version}/script/{shot}_roto_{out_version}.nk #04
    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}_ROTO_BAC_{show_maintain_version}/script/{shot}_roto_{out_version}.sfx #03
    write_node_path: "/{sg_plate_name}/{out_version}/{shot}_ROTO_BAC_{show_maintain_version}/{shot}_roto_{out_version}.mov"
    matte_path_split:
      file_name: "file_name.split('_')[-2]"
    render_list:
      exr_file_path: "{exr_path}"
    render:
      mate_copy:
        "key": []
      sfx_file_copy:
        "key": []
      nuke_shape_export:
        "key": ["MB_BKP"]
      export_all_shape_one:
        "key": []
      create_version_data:
        "key": []
      set_value_nkt:
        "key": []

    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

  tpr_roto:
    shot: shot.upper()
    out_version: out_version
    matte_extend_path: ["All_Layers", "{description}"]
    plate_version: ("v" + os.path.basename(source_path).split(".")[2].replace("v", "").zfill(3))
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    plate_name: next((s[i:i+4] for s in reversed(source_path.split('_')) for i in reversed(range(len(s)-3)) if s[i:i+2].isalpha() and s[i+2:i+4].isdigit()), None)
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_ROTO_BAC_{out_version}/" #02
    exr_path: /{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_ROTO_BAC_{out_version}/
    mb_folder_template: ""
    matte_naming_convention: "{shot}_{sg_plate_name}_roto_{description}_{out_version}"
    mb_nmb: ["MB"]
    mate_snippet:
      matte_snippet_path: "/tools/bpipe/config/coloroverlay_template/nuke_mov_input_template.nk"
    nuke_coloroverlay_template: "/tools/bpipe/config/coloroverlay_template/nuke_mov_input_template.nk"
    nuke_color_overlay_file: /{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_ROTO_BAC_{out_version}/Nuke_Shapes/{shot}_roto_{out_version}.nk #04
    write_node_path: "/{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_ROTO_BAC_{out_version}/QT/{shot}_roto_{out_version}.mov"
    matte_path_split:
      file_name: "file_name.split('_')[-2]"
    render_list:
