project_structure:
  - rf:
      - glf:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_ROTO_BAC_{show_maintain_version}":
                          - "{shot}_{sg_plate_name}_roto_{description}_{out_version}":
                              []
                          - script:
                              - "{shot}_roto_{out_version}.nk"
                              - "{shot}_roto_{out_version}.sfx"

      - lat:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_ROTO_BAC_{show_maintain_version}":
                          - "{shot}_{sg_plate_name}_roto_{description}_{out_version}":
                              []
                          - script:
                              - "{shot}_roto_{out_version}.nk"
                              - "{shot}_roto_{out_version}.sfx"

      - tnt:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_ROTO_BAC_{show_maintain_version}":
                          - "{shot}_{sg_plate_name}_roto_{description}_{out_version}":
                              []
                          - script:
                              - "{shot}_roto_{out_version}.nk"
                              - "{shot}_roto_{out_version}.sfx"

      - tpr:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_{sg_plate_name}_ROTO_BAC_{out_version}":
                          - "All_Layers":
                              - "{description}": []
                          - "Nuke_Shapes": []
                          - "QT": []

      - kpe:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_ROTO_BAC_{show_maintain_version}":
                          - "{shot}_{sg_plate_name}_roto_{description}_{out_version}":
                              []
                          - script:
                              - "{shot}_roto_{out_version}.nk"
                              - "{shot}_roto_{out_version}.sfx"
