project_structure:
  - ms:
      - aer:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_{sg_plate_name}_roto_{out_version}":
                          - "mattes":
                              - "{shot}_{sg_plate_name}_roto-{description}-mb_{out_version}":
                                  []
                              - "{shot}_{sg_plate_name}_roto-{description}-nmb_{out_version}":
                                  []
                          - "scripts":
                              - "nuke":
                                  - "{shot}_{sg_plate_name}_roto_{out_version}.nk"
                              - "silhouette":
                                  - "{shot}_{sg_plate_name}_roto_{out_version}.sfx"

      # For Example: aer_1306_003_020_el01_roto-matte01-mb_v001 instead of aer_1306_003_020_roto_matte01_mb_el01_v01

      - grd:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_roto_{sg_plate_name}_{out_version}":
                          - "mattes":
                              - "{shot}_roto_{description}_mb_{sg_plate_name}_{out_version}":
                                  []
                              - "{shot}_roto_{description}_nmb_{sg_plate_name}_{out_version}":
                                  []
                          - "scripts":
                              - "nuke":
                                  - "{shot}_roto_{sg_plate_name}_{out_version}.nk"
                              - "silhouette":
                                  - "{shot}_roto_{sg_plate_name}_{out_version}.sfx"
      - sun:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_{sg_plate_name}_roto_{out_version}":
                          - "mattes":
                              - "{shot}_{sg_plate_name}_roto-{description}-mb_{out_version}":
                                  []
                              - "{shot}_{sg_plate_name}_roto-{description}-nmb_{out_version}":
                                  []
                          - "scripts":
                              - "nuke":
                                  - "{shot}_{sg_plate_name}_roto_{out_version}.nk"
                              - "silhouette":
                                  - "{shot}_{sg_plate_name}_roto_{out_version}.sfx"

      - qur:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_{sg_plate_name}_roto_{out_version}":
                          - "mattes":
                              - "{shot}_{sg_plate_name}_roto-{description}-mb_{out_version}":
                                  []
                              - "{shot}_{sg_plate_name}_roto-{description}-nmb_{out_version}":
                                  []
                          - "scripts":
                              - "nuke":
                                  - "{shot}_{sg_plate_name}_roto_{out_version}.nk"
                              - "silhouette":
                                  - "{shot}_{sg_plate_name}_roto_{out_version}.sfx"
