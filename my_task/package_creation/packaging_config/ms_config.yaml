    nmb_dst_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/mattes/{shot}_roto_{description}_nmb_{sg_plate_name}_{out_version}/{shot}_roto_{description}_nmb_{sg_plate_name}_{out_version}.%04d.exr"
    nmb_folder_template: ""

    exr_path: /{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/mattes/

    nuke_color_overlay_file: /{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/scripts/nuke/{shot}_roto_{sg_plate_name}_{out_version}.nk
    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}_roto_{sg_plate_name}_{out_version}/scripts/silhouette/{shot}_roto_{sg_plate_name}_{out_version}.sfx

