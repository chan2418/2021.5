        Read1: []
        Read2: []

  dooh_roto:
    shot: shot.upper()
    out_version: out_version
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    plate_name: source_path.split(".")[0].split("_")[-2].upper()
    # Override sg_plate_name to auto-derive from source_path (e.g. L01)
    # Prevents ghost folders like BOM_0030_EMATTE__v001 when sg_plate_name is empty
    sg_plate_name: source_path.split(".")[0].split("_")[-2].upper()

    # MB and NMB both required
    mb_nmb: ["MB", "NMB"]

    # Delivery root: common parent for both MB and NMB folders
    # Code does: out_path + project_base_path (else branch — no nmb_project_base_path)
    project_base_path: "/{sg_plate_name}/{out_version}/"

    # MB matte (run_mb_copy)
    # Result: out_path/{sg_plate_name}/{out_version}/AAA_0010_EMATTE_L01_v001/AAA_0010_EMATTE_L01_v001.%04d.exr
    mb_dst_path: "/{sg_plate_name}/{out_version}/{shot}_EMATTE_{sg_plate_name}_{out_version}/{shot}_EMATTE_{sg_plate_name}_{out_version}.%04d.exr"

    # NMB matte (render_nmb_token_driven)
    # Code: actual_base = out_path + project_base_path → out_path/{sg_plate_name}/{out_version}/
    # Then: dst_folder = actual_base + nmb_extend_path → .../AAA_0010_EMATTE_NMB_L01_v001/
    nmb_extend_path: ["{shot}_EMATTE_NMB_{sg_plate_name}_{out_version}"]
    matte_naming_convention: "{shot}_EMATTE_NMB_{sg_plate_name}_{out_version}"
    nmb_folder_template: ""

    exr_path: "/{sg_plate_name}/{out_version}/{shot}_EMATTE_{sg_plate_name}_{out_version}/"

    # Nuke + SFX go in a separate scripts/ folder alongside MB and NMB — NOT inside the render folder
    nuke_color_overlay_file: "/{sg_plate_name}/{out_version}/scripts/{shot}_EMATTE_{sg_plate_name}_{out_version}.nk"
    dst_path_sx: "/{sg_plate_name}/{out_version}/scripts/{shot}_EMATTE_{sg_plate_name}_{out_version}.sfx"

    nuke_full_shpae_path: "/{sg_plate_name}/{out_version}/scripts/"
    mb_nuke_file_template: "{shot}_EMATTE_{sg_plate_name}_{out_version}.nk"

    new_update: yes
    matte_path_changes: yes

    render:
      run_mb_copy:
        "key": []
      render_nmb_token_driven:
        "key": ["NMB"]
      nuke_shape_export:
        "key": ["MB_BKP"]
      export_all_shape_one:
        "key": []
      sfx_file_copy:
        "key": []
      create_version_data:
        "key": []

    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

################################################### folder Structure ############################################################

project_structure:
  - bte:
      - kpc:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}": #04
                      - "{shot}_{sg_plate_name}_roto_{out_version}":
                          - "{shot}_EMATTE_{sg_plate_name}_{out_version}": []
                          - "scripts":
                              - "Nuke": []
                              - "Sfx":
                                  - "{shot}_{sg_plate_name}_roto_{out_version}.sfx"

      - ps:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}": #04
                      - "{shot}_{sg_plate_name}_roto_{out_version}":
                          - "{shot}_EMATTE_{sg_plate_name}_{out_version}": []
                          - "scripts":
                              - "Nuke": []
                              - "Sfx":
                                  - "{shot}_{sg_plate_name}_roto_{out_version}.sfx"

      - vt:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}": #04
                      - "{shot}_{sg_plate_name}_roto_{out_version}":
                          - "{shot}_EMATTE_{sg_plate_name}_{out_version}": []
                          - "scripts":
                              - "Nuke": []
                              - "Sfx":
                                  - "{shot}_{sg_plate_name}_roto_{out_version}.sfx"

      - dooh:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      # MB render folder — EXR frames only
                      - "{shot}_EMATTE_{sg_plate_name}_{out_version}": []
                      # NMB render folder — EXR frames only
                      - "{shot}_EMATTE_NMB_{sg_plate_name}_{out_version}": []
                      # Scripts folder — nuke and sfx sit here, separate from renders
                      - "scripts":
                          - "{shot}_EMATTE_{sg_plate_name}_{out_version}.nk"
                          - "{shot}_EMATTE_{sg_plate_name}_{out_version}.sfx"
