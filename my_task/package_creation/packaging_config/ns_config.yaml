##########################################################################
#
#       CLIENT : NS | SHOW : CRE (ns_cre)
#
##########################################################################

out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'dept','upload',department)"
roto_out_path: "os.path.join(os.path.dirname(input_path).split('dept')[0],'dept','upload',department)"
roto_main_out: "os.path.join(os.path.dirname(input_path).split('dept')[0],'out',department)"
publish_out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'out')"
color_space_index: 10
sg_status_list: "pentec"
source_path: source_path
sg_plate_name: sg_plate_name
plate_name: ""
new_update: yes
matte_path_changes: yes

paths:
  nuke: /apps/nuke/Nuke14.0v6/Nuke14.0
  silhouette: /usr/local/silhouette/silhouette
  text: xdg-open
  rv: /apps/rv-centos7-2023.0.1/bin/rv

extensions:
  nuke: [.nk]
  silhouette: [.sfx]
  text: [.txt, .json, .yml, .yaml, .log]

settings:
  default_cache_dir: ~/nuke_cache
  thumbnail_format: jpeg

###################################################### Tokens ###################################################################

tokens:
  cre_roto:
    shot: shot.lower()
    out_version: ("v" + out_version.replace("v", ""))
    plate_version: ("v" + os.path.basename(source_path).split(".")[2].replace("v", "").zfill(3))
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    plate_name: next((s[i:i+4] for s in reversed(source_path.split('_')) for i in reversed(range(len(s)-3)) if s[i:i+2].isalpha() and s[i+2:i+4].isdigit()), None)

    mb_nmb: ["MB"]
    # Base Deliverable Root: /{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/"

    # ── ms-style run_mb_copy target destination ──────────────────
    # Destination: /{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/matte/{shot}_roto_{description}_{out_version}/{shot}_roto_{description}_{out_version}.%04d.exr
    mb_dst_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/matte/{shot}_roto_{description}_{out_version}/{shot}_roto_{description}_{out_version}.%04d.exr"
    exr_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/matte/{shot}_roto_{description}_{out_version}/"

    # Workfiles (scripts/ folder): Nuke export_all_shape_one .nk and current .sfx workfile
    nuke_full_shpae_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/scripts/"
    nuke_color_overlay_file: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/scripts/{shot}_roto_{out_version}.nk"
    dst_path_sx: "/{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/scripts/{shot}_roto_{out_version}.sfx"

    new_update: yes
    matte_path_changes: yes

    matte_path_split:
      file_name: "file_name.split('_')[-2]"

    render_list:
      exr_file_path: "{exr_path}"

    render:
      run_mb_copy:
        "key": []
      sfx_file_copy:
        "key": []
      nuke_shape_export:
        "key": ["MB_BKP"]
      export_all_shape_one:
        "key": []
      create_version_data:
        "key": []

    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

################################################### Folder Structure ############################################################

project_structure:
  - ns:
      - cre:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_roto_{out_version}":
                          - matte:
                              - "{shot}_roto_{description}_{out_version}": []
                          - scripts:
                              - "{shot}_roto_{out_version}.nk"
                              - "{shot}_roto_{out_version}.sfx"
