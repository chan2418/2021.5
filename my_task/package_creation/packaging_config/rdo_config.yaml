#################################################### Show Init Setup ###########################################################
out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'dept','upload',department)"
roto_out_path: "os.path.join(os.path.dirname(input_path).split('dept')[0],'dept','upload',department)"
roto_main_out: "os.path.join(os.path.dirname(input_path).split('dept')[0],'out',department)"
publish_out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'out')"
color_space_index: 10
sg_status_list: "pentec"
source_path: source_path
plate_name: ""
new_update: yes
matte_path_changes: yes
# matte02 artist was given the roto layer name
##################################################### smt B_cart creative tool path setup #######################################
paths:
  nuke: /apps/nuke/Nuke14.0v6/Nuke14.0
  silhouette: /usr/local/silhouette/silhouette
  text: xdg-open
  rv: /apps/rv-centos7-2023.0.1/bin/rv
# File extensions configuration
extensions:
  nuke:
    - .nk
  silhouette:
    - .sfx
  text:
    - .txt
    - .json
    - .yml
    - .yaml
    - .log
# Other configuration settings
settings:
  default_cache_dir: ~/nuke_cache
  thumbnail_format: jpeg
tokens:
  bend_roto:
    matte_extend_path: ["Render"]
    shot: shot.upper()
    out_version: ("v" + out_version.replace("v", ""))
    # descriptions: { descriptions }
    frame_range: os.path.basename(source_path).split(".")[1]
    extension: os.path.basename(source_path).split(".")[-1]
    plate_name: next((s[i:i+4] for s in reversed(source_path.split('_')) for i in reversed(range(len(s)-3)) if s[i:i+2].isalpha() and s[i+2:i+4].isdigit()), None)
    mate_snippet:
      {
        "matte_snippet_path": "/tools/bpipe/config/coloroverlay_template/nuke_coloroverlay_matte_rdo.nk",
      }
    nuke_coloroverlay_template: "/tools/bpipe/config/coloroverlay_template/nuke_coloroverlay_matte_rdo.nk"
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_roto_{out_version}/" #02
    exr_path: /{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_roto_{out_version}/
    mb_nmb: []
    nuke_color_overlay_file: /{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_roto_{out_version}/Workfile/{shot}_{sg_plate_name}_roto_{out_version}.nk #03
    write_node_path: /{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_roto_{out_version}/Render/{shot}_{sg_plate_name}_roto_{out_version}.%04d.exr #04
    nuke_client_file: /tools/bpipe/config/coloroverlay_template/nuke_coloroverlay_rdo.nk
    render_list:
      exr_file_path: "{exr_path}"
    render:
      nuke_multiple_shape_export:
        "key": []
        "export_mode": "layer"
      set_value_nkt:
        "key": []
      save_tmp_coloroverlay:
        "key": []
      change_nuke_file:
        "key": []
      create_version_data:
        "key": []
    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []
project_structure:
  - rdo:
      - bend:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}":
                      - "{shot}_{sg_plate_name}_roto_{out_version}":
                          - Render: []
                          - Workfile: []
