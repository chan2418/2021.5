##################################################### Show Init Setup ###########################################################

out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'dept','upload',department)"
roto_out_path: "os.path.join(os.path.dirname(input_path).split('dept')[0],'dept','upload',department)"
publish_out_path : "os.path.join(os.path.dirname(input_path).split('in')[0],'out')"
color_space_index : 10
sg_status_list : "pentec"
source_path : source_path
sg_plate_name : sg_plate_name #01
roto_main_out: "os.path.join(os.path.dirname(input_path).split('dept')[0],'out',department)"
new_update : yes





##################################################### OOU B_cart creative tool path setup #######################################

paths:
  nuke: /apps/nuke/Nuke14.0v6/Nuke14.0
  silhouette: /usr/local/silhouette/silhouette
  text: xdg-open
  rv: /apps/rv-centos7-2023.0.1/bin/rv

# File extensions configuration
extensions:
  nuke:
    - .nk
  silhouette:
    - .sfx
  text:
    - .txt
    - .json
    - .yml
    - .yaml
    - .log

# Other configuration settings
settings:
  default_cache_dir: ~/nuke_cache
  thumbnail_format: jpeg

###################################################### Tokens ###################################################################

tokens:

  db_roto:
    out_version: out_version
    frame_range : os.path.basename(source_path).split(".")[1]
    extension : os.path.basename(source_path).split(".")[-1]
    plate_name : ("_".join(source_path.split("_")[-4:-1]).split(".")[0])
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}_roto_{plate_name}_tdm/" #02
    exr_path : os.path.join(out_path,out_version,shot,shot+"_basilicflyroto_differenceoverlay_"+out_version+"."+frame_range+"."+extension)
    mb_nuke_file_template: "{shot}_roto_{plate_name}_tdm.nk"

    mate_snippet : {"matte_snippet_path":"/tools/bpipe/config/coloroverlay_template/MM_DB & MM_CL _matte_snipet.nk"}
    nuke_coloroverlay_template: "/tools/bpipe/config/coloroverlay_template/MM_DB & MM_CL _template.nk"
    mb_nmb: []
    nuke_color_overlay_file : /{sg_plate_name}/{out_version}/{shot}_plate_{plate_name}_{out_version}/nuke/{shot}_roto_main_{out_version}.nk #04
    dst_path_sx : /{sg_plate_name}/{out_version}/{shot}_roto_{plate_name}_tdm/{shot}_roto_{plate_name}_tdm.sfx #03
    write_node_path : /{sg_plate_name}/{out_version}/{shot}_roto_{plate_name}_tdm/exr/{shot}_roto_{plate_name}_tdm.%04d.exr #04
    mb_nmb: ["MB"]

    # input_template_mov : "/tools/oou_comptest_colourloop_1_v001.nk"
    render :
      render_list:
        exr_file_path : "{exr_path}"

      sfx_file_copy:
        "key": []
      nuke_shape_export:
        "key": ["MB"]

      set_value_nkt:
        "key": []
      # save_tmp_coloroverlay:
      #   "key": []
      create_version_data:
        "key": []
      nuke_template_context_data :
        MB_matte_path:
