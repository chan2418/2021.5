##################################################### Show Init Setup ###########################################################

out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'dept','upload',department)"
roto_out_path: "os.path.join(os.path.dirname(input_path).split('dept')[0],'dept','upload',department)"
sg_plate_name: sg_plate_name #01

roto_main_out: "os.path.join(os.path.dirname(input_path).split('dept')[0],'out',department)"
publish_out_path: "os.path.join(os.path.dirname(input_path).split('in')[0],'out')"
color_space_index: 10
sg_status_list: "pentec"
source_path: os.path.basename(source_path)
new_update: yes
version_padding: 4

# nuke_version_path: "/apps/nuke/Nuke15.0v4/Nuke15.0"

##################################################### FT B_cart creative tool path setup #######################################

paths:
  nuke: /apps/nuke/Nuke14.0v6/Nuke14.0
  silhouette: /usr/local/silhouette/silhouette
  text: xdg-open
  rv: /apps/rv-centos7-2023.0.1/bin/rv

# File extensions configuration
extensions:
  nuke:
    - .nk
  silhouette:
    - .sfx
  text:
    - .txt
    - .json
    - .yml
    - .yaml
    - .log

# Other configuration settings
settings:
  default_cache_dir: ~/nuke_cache
  thumbnail_format: jpeg

###################################################### Tokens ###################################################################

tokens:
  ff84_roto:
    shot: shot.upper()
    nuke_extend_path: ["scripts"]
    silhouette_extend_path: ["scripts"]
    matte_extend_path: []
    nuke_full_shpae_path: /{sg_plate_name}/{out_version}/{shot}/
    out_version: out_version
    resolution: input_path.split("/")[-2]
    frame_range: os.path.basename(input_path).split(".")[1]
    extension: os.path.basename(input_path).split(".")[-1]
    plate_name: source_path.split(".")[0].split("_")[-2].upper()
    exr_file_name: os.path.basename(input_path)
    nuke_file_name: "{shot}_{sg_plate_name}_roto_mb_{out_version}_basfly_matte.nk"
    mb_folder_template: "{shot}_{sg_plate_name}_roto_mb_{out_version}_basfly_{description}"
    nmb_folder_template: "{shot}_{sg_plate_name}_roto_nomb_{out_version}_basfly_{description}"
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}/" #02
    mb_nuke_file_template: "{shot}_{sg_plate_name}_roto_mb_{out_version}_basfly_matte.nk"
    exr_path: /{sg_plate_name}/{out_version}/{shot}_CSMT_BFS_OS_roto_001/{shot}__{shot}__{sg_plate_name}__roto__{out_version}/{shot}__{shot}__{sg_plate_name}__roto__{out_version}.%04d.exr
    nuke_coloroverlay_template: "/tools/bpipe/config/coloroverlay_template/nuke_color_overlay_mum.nk"
    nuke_color_overlay_file: "/{sg_plate_name}/{out_version}/{shot}/{shot}_{sg_plate_name}_roto_mb_{out_version}_basfly_matte.nk"
    mb_nmb: ["MB", "NMB"]
    input_template_mov: "/tools/oou_comptest_colourloop_1_v001.nk"
    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}_CSMT_BFS_OS_roto_001/scripts/{shot}__{shot}__{sg_plate_name}__roto__v001.sfx #03
    write_node_path: /{sg_plate_name}/{out_version}/{shot}/{shot}_{sg_plate_name}_roto_mb_{out_version}_basfly_{description}.%04d.exr

    render:
      mate_copy:
        "key": []
      render_nmb:
        "key": ["NMB"] # want nmb render send the nmb key
      nuke_shape_export:
        "key": ["MB_BKP"]
      export_all_shape_one:
        "key": []
      create_version_data:
        "key": []
    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

  # RSE_SHP – client naming (Aug 2026):
  #   Nothing after username basfly. matte/description BEFORE version.
  #   Example: 101_052_0035_MP01-v0000_roto_mb_matteA_v0002_basfly.%04d.exr
  #   Pattern:  {shot}_{sg_plate_name}_roto_mb_{description}_{out_version}_basfly
  shp_roto:
    shot: shot.upper()
    nuke_extend_path: ["scripts"]
    silhouette_extend_path: ["scripts"]
    matte_extend_path: []
    out_version: out_version
    nuke_full_shpae_path: /{sg_plate_name}/{out_version}/{shot}/
    resolution: input_path.split("/")[-2]
    frame_range: os.path.basename(input_path).split(".")[1]
    extension: os.path.basename(input_path).split(".")[-1]
    plate_name: source_path.split(".")[0].split("_")[-2].upper()
    exr_file_name: os.path.basename(input_path)
    # basfly last — no suffix after basfly
    nuke_file_name: "{shot}_{sg_plate_name}_roto_mb_matte_{out_version}_basfly.nk"
    mb_folder_template: "{shot}_{sg_plate_name}_roto_mb_{description}_{out_version}_basfly"
    nmb_folder_template: "{shot}_{sg_plate_name}_roto_nomb_{description}_{out_version}_basfly"
    project_base_path: "/{sg_plate_name}/{out_version}/{shot}/" #02
    mb_nuke_file_template: "{shot}_{sg_plate_name}_roto_mb_matte_{out_version}_basfly.nk"
    exr_path: /{sg_plate_name}/{out_version}/{shot}/{shot}_{sg_plate_name}_roto_mb_{description}_{out_version}_basfly/{shot}_{sg_plate_name}_roto_mb_{description}_{out_version}_basfly.%04d.exr
    nuke_coloroverlay_template: "/tools/bpipe/config/coloroverlay_template/nuke_color_overlay_mum.nk"
    nuke_color_overlay_file: "/{sg_plate_name}/{out_version}/{shot}/{shot}_{sg_plate_name}_roto_mb_matte_{out_version}_basfly.nk"
    mb_nmb: ["MB", "NMB"]
    input_template_mov: "/tools/oou_comptest_colourloop_1_v001.nk"
    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}/{shot}_{sg_plate_name}_roto_mb_matte_{out_version}_basfly.sfx
    write_node_path: /{sg_plate_name}/{out_version}/{shot}/{shot}_{sg_plate_name}_roto_mb_{description}_{out_version}_basfly/{shot}_{sg_plate_name}_roto_mb_{description}_{out_version}_basfly.%04d.exr

    render:
      mate_copy:
        "key": []
      render_nmb:
        "key": ["NMB"] # want nmb render send the nmb key
      nuke_shape_export:
        "key": ["MB_BKP"]
      export_all_shape_one:
        "key": []
      create_version_data:
        "key": []
    nuke_template_context_data:
      MB_matte_path:
        Read1: []
        Read2: []

################################################### folder Structure ############################################################

project_structure:
  - rse:
      - ff84:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}": #04
                      - "{shot}":
                          - "{shot}_{sg_plate_name}_roto_mb_{out_version}_basfly_matte.nk"
                          - "{shot}_{sg_plate_name}_roto_mb_{out_version}_basfly_{description}":
                              []
                          - "{shot}_{sg_plate_name}_roto_nomb_{out_version}_basfly_{description}":
                              []

      - shp:
          - roto:
              - "{sg_plate_name}":
                  - "{out_version}": #04
                      - "{shot}":
                          - "{shot}_{sg_plate_name}_roto_mb_matte_{out_version}_basfly.nk"
                          - "{shot}_{sg_plate_name}_roto_mb_{description}_{out_version}_basfly":
                              []
                          - "{shot}_{sg_plate_name}_roto_nomb_{description}_{out_version}_basfly":
                              []
