    exr_path: /{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/
    mb_folder_template: "{shot}_roto_{description}_{out_version}"
    mb_nmb: ["MB"]
    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/{shot}_roto_{descriptions}_{out_version}.sfx
    nuke_color_overlay_file: /{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/{shot}_roto_{descriptions}_{out_version}.nk #03
    write_node_path: /{sg_plate_name}/{out_version}/{shot}_roto_{out_version}/{shot}_roto_{descriptions}_{out_version}.mov #04

    render_list:
