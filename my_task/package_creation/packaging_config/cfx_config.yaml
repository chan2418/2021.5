    mb_nmb: ["MB"]
    dst_path_sx: /{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_roto_{out_version}/{shot}_{sg_plate_name}_roto_{descriptions}_{out_version}.sfx
    nuke_color_overlay_file: /{sg_plate_name}/{out_version}/{shot}_{sg_plate_name}_roto_{out_version}/{shot}_{sg_plate_name}_roto_{descriptions}_{out_version}.nk #03
